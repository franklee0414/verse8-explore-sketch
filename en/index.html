const b2a=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(SALT),iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(IV)},key,b2a(DATA));
  const html=new TextDecoder().decode(plain);
  try{sessionStorage.setItem('v8pw',pw);}catch(e){}
  document.open();document.write(html);document.close();
}
const f=document.getElementById('f'),err=document.getElementById('err');
f.addEventListener('submit',async e=>{e.preventDefault();f.classList.add('wait');err.textContent='';try{await open(document.getElementById('pw').value);}catch(x){f.classList.remove('wait');err.textContent='비밀번호가 맞지 않습니다.';}});
try{const s=sessionStorage.getItem('v8pw');if(s){f.classList.add('wait');open(s).catch(()=>{f.classList.remove('wait');});}}catch(e){}
</script>
